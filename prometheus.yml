# ============================================
# NekoCafé Prometheus 配置
# 每15秒从 Spring Boot /actuator/prometheus 采集指标
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nekocafe-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8081']
